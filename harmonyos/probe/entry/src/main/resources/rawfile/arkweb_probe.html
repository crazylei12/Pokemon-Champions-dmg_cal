<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { margin: 0; background: #101827; color: #eef4ff; font: 16px sans-serif; }
    #status { padding: 12px; }
  </style>
</head>
<body>
  <div id="status">ARKWEB_LOCAL_READY</div>
  <script>
    function probeDamage(level, power, attack, defense, modifier) {
      const base = Math.floor(Math.floor(Math.floor((2 * level / 5 + 2) * power * attack / defense) / 50) + 2);
      return JSON.stringify({ value: Math.floor(base * modifier), source: 'local-fixed-js-v1' });
    }
  </script>
</body>
</html>
